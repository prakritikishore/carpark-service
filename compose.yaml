version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=carparkdb
      - DB_USER=carpark_user
      - DB_PASS=carpark_pass
      - API_AVAILABILITY_URL=https://api.data.gov.sg/v1/transport/carpark-availability
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=carparkdb
      - POSTGRES_USER=carpark_user
      - POSTGRES_PASSWORD=carpark_pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carpark_user -d carparkdb"]
      interval: 5s
      timeout: 5s
      retries: 5