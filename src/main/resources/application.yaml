spring:
  application:
    name: carpark-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:carparkdb}
    username: ${DB_USER:carpark_user}
    password: ${DB_PASS:carpark_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

carpark:
  csv-path: classpath:hdb-carpark-information.csv
  availability-url: ${API_AVAILABILITY_URL:https://api.data.gov.sg/v1/transport/carpark-availability}
  poll-rate-ms: 300000

